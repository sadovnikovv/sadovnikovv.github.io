 код","Сервер Anthropic всегда"],"answer":1,"explain":"Модель только просит вызвать инструмент; выполняет ваш код, кроме серверных инструментов."},{"q":"Что даёт strict tool use?","options":["Ускоряет модель","Строгое соответствие аргументов схеме","Отключает проверки"],"answer":1,"explain":"Схема компилируется в грамматику, и модель не может выдать неверный тип или пропустить поле."},{"q":"Зачем нужен ресурс MCP?","options":["Чтобы предоставлять данные для подстановки в промпт","Чтобы модель сама нажимала кнопки","Чтобы заменить промпты"],"answer":0,"explain":"Ресурсы отдают данные, инструменты выполняют действия, промпты задают сценарии."},{"q":"Какой транспорт нужен, чтобы сервер мог инициировать запрос (sampling)?","options":["Только stdio","Транспорт с потоком событий, например StreamableHTTP","Любой"],"answer":1,"explain":"Без долгого соединения запросы от сервера к клиенту невозможны."},{"q":"Что такое добросовестность (diligence) в рамке 4D?","options":["Умение писать промпты","Ответственность и прозрачность при работе с ИИ","Выбор модели"],"answer":1,"explain":"Это этическая и ответственностная часть: выбор системы, прозрачность, владение результатом."},{"q":"Что главное в Cowork для безопасности?","options":["Выбранная рабочая папка","Размер промпта","Скорость модели"],"answer":0,"explain":"Папка задаёт границы чтения и записи."},{"q":"Что позволяет командный агент, чего не умеет «личный»?","options":["Свою идентичность, общую память и общий контекст команды","Отвечать быстрее","Работать без сети"],"answer":0,"explain":"Три отличия командного агента: идентичность, общая память, общий контекст."}]</script>
